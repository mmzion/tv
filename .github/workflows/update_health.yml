name: Stream Health Checker

on:
  schedule:
    - cron: '*/5 * * * *' # প্রতি ৫ মিনিট পর পর রান করবে
  workflow_dispatch: # অ্যাডমিন বাটনের মাধ্যমে ইনস্ট্যান্ট ট্রিগারের জন্য

jobs:
  check-streams:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Python Checker Script
      run: python checker.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Zion Action Bot"
        git add health.json
        # ফাইলে কোনো নতুন আপডেট থাকলেই কেবল পুশ করবে
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update channel health"
        git push
